server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Cabeçalhos da página. A API tem os seus próprios, aplicados pelo helmet.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # A API é servida na mesma origem do frontend, então o navegador nunca faz
  # requisição cross-origin e o CORS deixa de ser o que separa quem pode usar
  # o backend. Quem protege a cota é o rate limit, no servidor.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # Os assets levam hash no nome, então podem ser guardados indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O index nunca é cacheado: é ele que aponta para os assets novos a cada deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
